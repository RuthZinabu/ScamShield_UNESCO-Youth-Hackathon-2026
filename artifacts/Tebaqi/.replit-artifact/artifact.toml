kind = "web"
previewPath = "/"
title = "Tebaqi"
version = "1.0.0"
id = "artifacts/Tebaqi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24814

[services.development]
run = "pnpm --filter @workspace/Tebaqi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/Tebaqi", "run", "build" ]
serve = "static"
publicDir = "artifacts/Tebaqi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24814"
BASE_PATH = "/"
